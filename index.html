<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <div class="board-container">
            <div id="chessboard"></div>
        </div>
        
        <div class="info-panel">
            <h3>Chess Game</h3>
            
            <div class="turn-indicator white-turn" id="turnIndicator">
                White's Turn
            </div>
            
            <div class="info-item">
                <strong>Selected Piece:</strong>
                <div id="selectedPiece">None</div>
            </div>
            
            <div class="info-item">
                <strong>Available Moves:</strong>
                <div id="availableMoves">0 moves</div>
            </div>
            
            <div class="info-item">
                <strong>Captured Pieces:</strong>
                <div class="piece-list" id="capturedPieces"></div>
            </div>
            
            <div class="controls">
                <button id="resetBtn">New Game</button>
                <button id="undoBtn">Undo Move</button>
            </div>
            
            <div class="info-item" style="margin-top: 20px;">
                <strong>Instructions:</strong>
                <p style="font-size: 12px; margin-top: 5px;">
                    Click a piece to select it, then click a highlighted square to move.
                </p>
            </div>
        </div>
    </div>

    <!-- Modal container for promotion dialog -->
    <div id="modal-container"></div>

    <script src="./js/ChessPiece.js"></script>
    <script src="./js/ChessSide.js"></script>
    <script src="./js/ChessBoard.js"></script>
    <script src="./js/modal-loader.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
